<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Mi Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">⛏️ <span id="title">Mi Launcher</span></div>
      <span class="version" id="launcher-version"></span>
    </header>

    <div id="banner" class="banner hidden">
      <p id="banner-text"></p>
      <button id="banner-link" class="link-btn hidden">Descargar actualización</button>
    </div>

    <main>
      <section class="card" id="server-info">
        <h2 id="server-name">Cargando servidor...</h2>
        <p class="motd" id="motd"></p>
        <div class="chips">
          <span class="chip hidden" id="chip-version"></span>
          <span class="chip hidden" id="chip-loader"></span>
          <span class="chip hidden" id="chip-mods"></span>
          <span class="chip hidden" id="chip-ip"></span>
        </div>
      </section>

      <section class="card" id="play-card">
        <div class="row">
          <label for="username">Nombre de jugador</label>
          <input id="username" type="text" maxlength="16" placeholder="Steve" autocomplete="off" spellcheck="false" />
        </div>
        <div class="row">
          <label for="ram">Memoria RAM</label>
          <select id="ram">
            <option value="2">2 GB</option>
            <option value="4" selected>4 GB</option>
            <option value="6">6 GB</option>
            <option value="8">8 GB</option>
            <option value="12">12 GB</option>
          </select>
        </div>
        <div class="buttons">
          <button id="play-offline" class="btn primary" disabled>▶ Jugar</button>
          <button id="play-ms" class="btn secondary" disabled>Jugar con cuenta Microsoft</button>
        </div>
      </section>

      <section id="progress-area" class="hidden">
        <div class="progress-track"><div id="progress-bar"></div></div>
        <p id="status-text"></p>
      </section>
    </main>

    <footer>
      <span id="footer-note">Los mods y la configuración se actualizan automáticamente.</span>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
